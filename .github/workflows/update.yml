name: Update global and Hong Kong IPTV
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
  push:
    branches: [main]
    paths: ['merge.py', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update-playlist
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge all sources
        run: python merge.py
      - name: Publish playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add merged.m3u report.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update global and Hong Kong playlist'
            git push
          fi
